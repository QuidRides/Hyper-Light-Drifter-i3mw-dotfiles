[colors]
background = #12151F
background-alt = #b5046e
foreground = #ffffff
foreground-alt = #585B70
primary = #FF2FC1
secondary = #46dd8c
yellow = #F0C674
alert = #d82124
disabled = #413841

[bar/main]
width = 98%
height = 14pt
radius = 1
offset-x = 1%
offset-y = 5pt
override-redirect = true
bottom = false
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0pt

border-size = 3pt
border-color = ${colors.background}

padding-left = 0
padding-right = 0

module-margin = 1

separator = ""
separator-foreground = ${colors.foreground-alt}

font-0 = "HyperDrifterMenuNerdFontPropo-LightTextRegular:size=8;3"

 ; Bar Layout
modules-left =  xworkspaces xwindow
modules-right = cpu memory pulseaudio systray date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

;override-redirect = true

[module/systray]
type = internal/tray

format-margin = 0pt
tray-spacing = 6pt
tray-size = 100%
tray-background = ${colors.secondary}
tray-foreground = ${colors.background}

[module/i3]
type = internal/i3

; Focused workspace
label-focused = %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.primary}
label-focused-padding = 1

; Unfocused workspace
label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding = 1

; Visible workspace (on another monitor, if any)
label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

; Urgent workspace
label-urgent = %index%
label-urgent-foreground = ${colors.yellow}
label-urgent-padding = 1

; Separator
label-separator = |
label-separator-foreground = ${colors.disabled}

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.primary}
label-active-underline= ${colors.primary}
label-active-padding = 1
label-active-foreground = ${colors.foreground}

label-occupied = %name%
label-occupied-foreground = ${colors.foreground-alt}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:10:45:...%
label-foreground = ${colors.foreground}

[module/filesystem]
;type = internal/fs
;interval = 25

;mount-0 = /

;label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

;label-unmounted = %mountpoint% not mounted
;label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

ramp-volume-0 =  
ramp-volume-1 = 
ramp-volume-2 =  
ramp-volume-3 = 
ramp-volume-padding = 1
ramp-volume-foreground = ${colors.background}
ramp-volume-background = ${colors.secondary}

format-volume = <ramp-volume> <label-volume>

label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

label-muted = "󰝟 "
label-muted-padding = 1
label-muted-foreground = ${colors.secondary}
label-muted-background = ${colors.foreground-alt}

click-right = exec ~/.config/rofi/applets/bin/volume.sh

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1

format-charging = "Battery  <label-charging>"
format-discharging = "Battery <ramp-capacity> <label-discharging>"
format-full = "Battery  <label-full>"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%




[module/xkeyboard]
;type = internal/xkeyboard
;blacklist-0 = num lock

;label-layout = %layout%
;label-layout-foreground = ${colors.primary}

;label-indicator-padding = 2
;label-indicator-margin = 1
;label-indicator-foreground = ${colors.background}
;label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix-padding-left = 1
format-prefix = " "
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.secondary}
label = %percentage_used:2%%
label-padding-left = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix-padding-left = 1
format-prefix = " "
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.secondary}
label = %{A1:xfce4-terminal -e btop:}%{F#ffffff}%percentage:2%%%{F-}%{A}
label-padding-left = 1

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-connected-padding = 1
format-connected-foreground = ${colors.background}
format-connected-background = ${colors.secondary}
format-disconnected = <label-disconnected>
label-disconnected = %{F#C50ED2}%ifname%%{F#707880} 󰖪

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = 󰖩

click-right = exec nm-applet &

[module/eth]
;inherit = network-base
;interface-type = wired
;label-connected = %{F#C50ED2}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %{A1:gnome-calendar:}%date%%{A}
label-padding-left = 1
label-padding-right = 1
label-foreground = ${colors.background}
label-background = #F0C674

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/i3-volume]
;type = custom/script
;tail = true
;label = %output%
;exec = ~/i3-volume/volume listen "%i %v %p\n"
;scroll-up = ~/i3-volume/volume up
;scroll-down = ~/i3-volume/volume down
;click-left = ~/i3-volume/volume
;click-right = exec pavucontrol &

